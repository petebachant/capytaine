name: Build wheels

# Linux aarch64 wheels for capytaine 2.3.1, which has none on PyPI,
# with libquadmath linked only on Windows so the build works there
on:
  workflow_dispatch:
  push:
    branches:
      - v2.3.1-aarch64-wheels

jobs:
  "build_wheels_on_ubuntu_arm":
    name: Build wheels on Ubuntu ARM
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # The manylinux container has its own gfortran
      - name: Build wheels on Ubuntu ARM
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_SKIP: "*musllinux* cp314t*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-arm
          path: ./wheelhouse/*.whl
